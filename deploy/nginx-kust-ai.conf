# =====================================================================
# KUSTSpringAI  Nginx 反向代理配置（仅 HTTP）
#
# 架构：Nginx 托管前端静态资源(kust-ai/dist) + 反代 /api 到 Spring Boot
#       前端 axios baseURL 为空(同源)，无 CORS 问题
#
# 安装：
#   cp deploy/nginx-kust-ai.conf /etc/nginx/conf.d/kust-ai.conf
#   nginx -t && nginx -s reload        # 或 systemctl reload nginx
# =====================================================================

server {
    listen 80;
    server_name _;                     # 改成你的域名或服务器IP，如 kust.example.com

    server_tokens off;                 # 隐藏 Nginx 版本号
    charset utf-8;

    # 与后端 multipart 限制对齐（后端 max-request-size=12MB），超过返回 413
    client_max_body_size 12m;

    # ---------- 前端静态资源（kust-ai/dist） ----------
    root /opt/kust-ai/dist;
    index index.html;

    # Vite 产物文件名带内容 hash，可强缓存一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history 路由回退：直接刷新/访问子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身禁止缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # 后端只监听回环地址
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === SSE 流式关键配置：关闭缓冲，逐字实时推送 ===
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # AI 生成最长轮询 600s，读/写超时必须大于后端处理时长
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # (可选) 匿名 AI 接口限流防刷（AI 调用付费）。
        # 需在 nginx.conf 的 http{} 层先定义：
        #   limit_req_zone $binary_remote_addr zone=ai_api:10m rate=10r/m;
        # limit_req zone=ai_api burst=20 nodelay;
    }
}

# ===== 静态资源 gzip（可选，放 http{} 层或本文件均可）=====
# 注意：不要设置 gzip_proxied，否则可能对 /api 响应（含 SSE）做缓冲压缩
# gzip on;
# gzip_min_length 1k;
# gzip_types text/plain text/css application/javascript application/json image/svg+xml;
